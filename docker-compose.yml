services:
  db-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_DB_NAME:-resourcehive_dev}
      POSTGRES_USER: ${DEV_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-devpassword}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-postgres} -d ${DEV_DB_NAME:-resourcehive_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-dev:
    image: cvsu-inventory:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "True"
      SECRET_KEY: ${DEV_SECRET_KEY:-dev-only-secret-key}
      ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DEV_DB_NAME:-resourcehive_dev}
      DB_USER: ${DEV_DB_USER:-postgres}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-devpassword}
      DB_HOST: db-dev
      DB_PORT: "5432"
      GUNICORN_WORKERS: "1"
    depends_on:
      db-dev:
        condition: service_healthy
    ports:
      - "${DEV_PORT:-8000}:8000"
    volumes:
      - .:/app
      - media_dev_data:/app/media
      - static_dev_data:/app/staticfiles
    entrypoint: ["/bin/sh", "-c"]
    command: ["python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]

  db-prod:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROD_DB_NAME:-resourcehive_prod}
      POSTGRES_USER: ${PROD_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-change-this-production-password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER:-postgres} -d ${PROD_DB_NAME:-resourcehive_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-prod:
    image: cvsu-inventory:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${PROD_SECRET_KEY:?Set PROD_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${PROD_ALLOWED_HOSTS:?Set PROD_ALLOWED_HOSTS in .env}
      DB_NAME: ${PROD_DB_NAME:-resourcehive_prod}
      DB_USER: ${PROD_DB_USER:-postgres}
      DB_PASSWORD: ${PROD_DB_PASSWORD:?Set PROD_DB_PASSWORD in .env}
      DB_HOST: db-prod
      DB_PORT: "5432"
      GUNICORN_WORKERS: ${PROD_GUNICORN_WORKERS:-3}
    depends_on:
      db-prod:
        condition: service_healthy
    ports:
      - "${PROD_PORT:-8001}:8000"
    volumes:
      - media_prod_data:/app/media
      - static_prod_data:/app/staticfiles

volumes:
  postgres_dev_data:
  postgres_prod_data:
  media_dev_data:
  media_prod_data:
  static_dev_data:
  static_prod_data:
